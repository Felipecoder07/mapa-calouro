name: Keepalive Supabase

on:
  schedule:
    # Roda automaticamente todos os dias às 06:00 AM (UTC)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite rodar manualmente pelo GitHub a qualquer momento

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Realizar ping de manutenção
        run: |
          echo "Realizando ping diário para manter o Supabase ativo 24/7..."
          curl -s -o /dev/null -w "%{http_code}" "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/categories?select=id&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}" || true
          echo "Ping concluído com sucesso!"
